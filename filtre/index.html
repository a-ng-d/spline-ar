<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Spline AR — Face filter</title>
  <!-- 8th Wall engine (distributed binary, under its own license, loaded from jsDelivr) + XR Extras.
       The "slam" chunk is also needed: XR8.Threejs calls XR8.XrController when the session starts. -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="face, slam"></script>
  <link rel="stylesheet" href="/src/theme.css" />
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden }
    #camerafeed { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block }
    /* Spline runtime: transparent canvas above the camera, receives touches. */
    .spline-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
      z-index: 5; background: transparent; visibility: hidden; touch-action: none; outline: none }
    .tuning { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 26; max-width: 460px; margin: 0 auto;
      background: rgba(6,6,15,.85); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: 8px }
    .tuning[hidden] { display: none }
    .tuning-head { display: flex; align-items: center; justify-content: space-between }
    .tuning-head .section-label { margin: 0 }
    .tuning.folded .tuning-body { display: none }
    .tuning-body { display: flex; flex-direction: column; gap: 6px }
    .tuning select { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; color: var(--text); font: 13px var(--font) }
    .tuning option { background: #14141e }
    .trow { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; font-size: 12px }
    .trow output { text-align: right; font: 11px var(--mono); color: var(--muted) }
    .tuning-foot { display: flex; align-items: center; gap: 10px; margin-top: 2px }
    body.tuning-on #hint { bottom: auto; top: 64px }
  </style>
</head>
<body class="player">
  <canvas id="camerafeed"></canvas>
  <div id="credit"><a href="https://spline.design" target="_blank" rel="noopener" data-i18n="player.credit">Made with Spline</a> · <a href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noopener">8th Wall engine © Niantic Spatial</a></div>

  <div id="start">
    <canvas id="bg-canvas"></canvas>
    <div class="card">
      <div class="card-head">
        <div class="logo"><span class="logo-dot"></span>Spline AR</div>
        <div id="lang-slot"></div>
      </div>
      <div>
        <div id="kicker" class="kicker" data-i18n="types.filter">Face filter</div>
        <h1 id="title"></h1>
        <p id="subtitle" class="lead" data-i18n="filter.player.subtitle"></p>
      </div>
      <div id="progress" class="progress"></div>
      <div id="error" class="error-box"></div>
      <button id="btn-start" class="btn btn-primary btn-block" data-i18n="filter.player.start" disabled>Start the filter →</button>
      <div class="divider" data-i18n="common.or">or</div>
      <a id="back-link" class="btn btn-ghost btn-block" data-i18n="common.back" hidden>← Back</a>
      <a id="edit-link" class="btn btn-ghost btn-block" data-i18n="filter.player.edit" hidden>Edit this filter</a>
      <a href="/creer" class="btn btn-ghost btn-block" data-i18n="player.createLink">Create a museum or a filter</a>
      <a href="/" class="btn btn-ghost btn-sm" style="align-self:center" data-i18n="nav.homeBack">← Home</a>
    </div>
  </div>

  <div id="hint" class="pill hint" data-i18n="filter.player.hint"></div>
  <button id="quit" class="pill quit" data-i18n-title="player.quitTitle"></button>
  <div id="tuning" class="tuning" hidden>
    <div class="tuning-head">
      <div class="section-label" data-i18n="filter.tuning.title">Live tuning</div>
      <button class="btn btn-sm btn-ghost fold" data-i18n="filter.tuning.fold">Fold</button>
    </div>
    <div class="tuning-body">
      <select aria-label="Anchor point" data-i18n-aria-label="filter.editor.point"></select>
      <div class="trow"><label data-i18n="settings.size">Size</label><input data-k="s" type="range" min="0.1" max="3" step="0.05" /><output></output></div>
      <div class="trow"><label data-i18n="settings.leftRight">Left / right</label><input data-k="x" type="range" min="-1" max="1" step="0.02" /><output></output></div>
      <div class="trow"><label data-i18n="settings.downUp">Down / up</label><input data-k="y" type="range" min="-1" max="1.5" step="0.02" /><output></output></div>
      <div class="trow"><label data-i18n="settings.frontBack">Front / back</label><input data-k="z" type="range" min="-1" max="1" step="0.02" /><output></output></div>
      <div class="trow"><label data-i18n="settings.rotation">Rotation</label><input data-k="ry" type="range" min="-180" max="180" step="5" /><output></output></div>
      <div class="tuning-foot"><button class="btn btn-primary btn-sm save" data-i18n="actions.save">Save</button><div class="msg"></div></div>
    </div>
  </div>
  <div id="debug" class="debug"></div>

  <script type="module" src="/src/filter-player.js"></script>
</body>
</html>
