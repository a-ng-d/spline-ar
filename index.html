<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="home.pageTitle">Spline AR</title>
  <meta name="description" content="Bring your Spline scenes out of a poster, or wear them on your face, with a simple link. Open-source WebAR for students." />
  <script>
    // Legacy museum links (/?o=…, /?target=…, /?scene=…) → /musee, before anything renders.
    (function () {
      var q = new URLSearchParams(location.search)
      if (q.has('o') || q.has('target') || q.has('scene')) location.replace('/musee' + location.search)
    })()
  </script>
  <link rel="stylesheet" href="/src/theme.css" />
  <style>
    body { min-height: 100vh; padding: 32px 16px 60px; display: flex; justify-content: center }
    main { position: relative; z-index: 1; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px }
    main .card { max-width: none }
    h1 { font-size: 28px }
    .ctas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
    @media (max-width: 520px) { .ctas { grid-template-columns: 1fr } }
    .ctas .btn-face { background: rgba(62,207,207,.12); border: 1px solid rgba(62,207,207,.35); color: var(--accent2) }
    .ctas .btn-face:hover { background: rgba(62,207,207,.2) }
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px }
    .list-head .section-label { margin: 0 }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent2);
      background: rgba(62,207,207,.1); border: 1px solid rgba(62,207,207,.25); border-radius: 100px; padding: 2px 8px }
    footer { text-align: center; font-size: 12px; color: var(--muted) }
    footer a { color: var(--muted) }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<main>
  <div class="card">
    <div class="card-head">
      <div class="logo"><span class="logo-dot"></span>Spline AR</div>
      <div id="lang-slot"></div>
    </div>
    <div>
      <h1 data-i18n-html="home.title"></h1>
      <p class="lead" data-i18n="home.lead"></p>
    </div>
    <div class="ctas">
      <a class="btn btn-primary" href="/creer/musee?nouveau=1" data-i18n="home.createMuseum"></a>
      <a class="btn btn-face" href="/creer/filtre?nouveau=1" data-i18n="home.createFilter"></a>
    </div>
  </div>

  <div class="card">
    <div class="list-head">
      <div class="section-label" data-i18n="home.templates"></div>
      <span class="tag" data-i18n="home.templatesTag"></span>
    </div>
    <div id="templates" class="works"></div>
    <p class="help" style="margin-top:0" data-i18n="home.templatesHelp"></p>
  </div>

  <div class="card">
    <div class="list-head">
      <div class="section-label" data-i18n="works.title"></div>
      <span id="count" class="tag" hidden></span>
    </div>
    <div id="works" class="works"></div>
    <p id="list-help" class="help" style="margin-top:0"></p>
  </div>

  <footer data-i18n-html="home.footer"></footer>
</main>
<script type="module" src="/src/home.js"></script>
</body>
</html>
