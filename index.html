<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Spline AR — affiche</title>
  <!-- Moteur 8th Wall (binaire distribué, licence d'usage limité) + utilitaires XR Extras -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; color: #f5f0e4;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif }
    #camerafeed { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; padding: 28px; text-align: center; background: #111; z-index: 20 }
    .overlay.hidden { display: none }
    h1 { font-size: 26px; letter-spacing: .02em }
    p { font-size: 15px; line-height: 1.45; opacity: .8; max-width: 340px }
    .meta { font: 12px ui-monospace, monospace; opacity: .55; word-break: break-all; max-width: 340px }
    button { font: 600 17px system-ui, sans-serif; padding: 14px 30px; border-radius: 999px; border: 0;
      background: #fabe28; color: #14141e; cursor: pointer }
    button:disabled { opacity: .45 }
    #progress { font-size: 13px; opacity: .7; min-height: 18px }
    #hint { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 10;
      background: rgba(20,20,30,.75); padding: 10px 18px; border-radius: 999px; font-size: 14px;
      pointer-events: none; transition: opacity .3s; opacity: 0 }
    #hint.visible { opacity: 1 }
    #error { color: #ff8a73; font-size: 14px; max-width: 340px }
    #debug { position: fixed; top: 8px; left: 8px; z-index: 30; display: none; max-width: 92vw;
      font: 11px/1.4 ui-monospace, monospace; color: #7fff7f; background: rgba(0,0,0,.8);
      padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; pointer-events: none }
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <div id="start" class="overlay">
    <h1>Affiche en réalité augmentée</h1>
    <p>Autorise la caméra, puis vise l'affiche en entier. La 3D apparaît dessus.</p>
    <div id="scene-info" class="meta"></div>
    <div id="progress">Chargement de la 3D…</div>
    <button id="btn-start" disabled>Lancer l'AR</button>
    <div id="error"></div>
  </div>

  <div id="hint">Vise l'affiche</div>
  <div id="debug"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
