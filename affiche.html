<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spline AR — Affiches</title>
  <link rel="stylesheet" href="/src/theme.css" />
  <style>
    body { min-height: 100vh; padding: 32px 16px }
    main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px }
    header { display: flex; flex-direction: column; gap: 8px }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px;
      cursor: zoom-in; transition: border-color .15s, background .15s }
    .tile:hover { border-color: var(--accent); background: rgba(123,110,246,.08) }
    .tile img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; display: block; border-radius: 8px }
    .tile span { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center }
    /* Plein écran : une affiche à viser avec le téléphone */
    #full { position: fixed; inset: 0; z-index: 50; background: #111; display: none; align-items: center;
      justify-content: center; cursor: zoom-out }
    #full.visible { display: flex }
    #full img { max-width: 100vw; max-height: 100vh; display: block }
    #full .pill { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .8 }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <main>
    <header>
      <div class="logo"><span class="logo-dot"></span>Spline AR</div>
      <h1 id="title">Les <span>affiches</span></h1>
      <p class="lead">Clique sur une affiche pour l'afficher en plein écran, puis vise l'écran avec le téléphone.</p>
    </header>
    <div id="grid" class="grid"></div>
  </main>
  <div id="full"><img alt="Affiche" /><div class="pill">Touche ou clique pour revenir · ← → pour changer</div></div>

  <!-- ?a=<id>&a=<id>… (galerie) ou ?target=<id> (une seule affiche, plein écran direct) ; sans paramètre : affiche de démo -->
  <script type="module">
    import { posterUrl } from '/src/shared.js'
    import { startBackground } from '/src/background.js'
    const p = new URLSearchParams(location.search)
    const ids = p.getAll('a').length ? p.getAll('a') : [p.get('target')]
    const srcs = ids.map(posterUrl)
    const full = document.getElementById('full'), fullImg = full.querySelector('img')
    let current = 0
    const open = i => { current = (i + srcs.length) % srcs.length; fullImg.src = srcs[current]; full.classList.add('visible') }
    full.onclick = () => { if (srcs.length > 1) full.classList.remove('visible') }
    addEventListener('keydown', e => {
      if (!full.classList.contains('visible')) return
      if (e.key === 'ArrowRight') open(current + 1)
      if (e.key === 'ArrowLeft') open(current - 1)
      if (e.key === 'Escape' && srcs.length > 1) full.classList.remove('visible')
    })
    if (p.get('t')) document.getElementById('title').textContent = p.get('t')
    if (srcs.length === 1) {
      open(0)
    } else {
      startBackground(document.getElementById('bg-canvas'))
      const grid = document.getElementById('grid')
      srcs.forEach((src, i) => {
        const tile = document.createElement('div')
        tile.className = 'tile'
        const img = document.createElement('img'); img.alt = ''; img.src = src
        const label = document.createElement('span'); label.textContent = `Affiche ${i + 1}`
        tile.append(img, label)
        tile.onclick = () => open(i)
        grid.appendChild(tile)
      })
    }
  </script>
</body>
</html>
