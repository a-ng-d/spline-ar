<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Affiche</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center }
    img { max-height: 100vh; max-width: 100vw; display: block }
  </style>
</head>
<body>
  <!-- Affiche à afficher en plein écran (ou à imprimer) pour tester le suivi.
       ?target=<id> affiche l'affiche créée sur la page Créer ; sans paramètre, l'affiche de démo. -->
  <img id="img" alt="Affiche" />
  <script type="module">
    import { posterUrl } from '/src/shared.js'
    document.getElementById('img').src = posterUrl(new URLSearchParams(location.search).get('target'))
  </script>
</body>
</html>
