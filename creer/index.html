<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="create.pageTitle">Spline AR — Create</title>
  <link rel="stylesheet" href="/src/theme.css" />
  <style>
    body { min-height: 100vh; padding: 32px 16px; display: flex; justify-content: center }
    main { position: relative; z-index: 1; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px }
    main > .card { max-width: none }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
    @media (max-width: 560px) { .choices { grid-template-columns: 1fr } }
    .choice { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--text);
      background: transparent; border: 1px solid var(--border); border-radius: var(--r); padding: 20px;
      transition: background .15s, border-color .15s, transform .15s }
    .choice:hover { background: rgba(123,110,246,.08); border-color: var(--accent); transform: translateY(-1px) }
    .choice.face:hover { background: rgba(62,207,207,.08); border-color: var(--accent2) }
    .choice-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      background: rgba(123,110,246,.15); border: 1px solid rgba(123,110,246,.4); color: var(--accent); font-size: 20px }
    .choice.face .choice-icon { background: rgba(62,207,207,.1); border-color: rgba(62,207,207,.3); color: var(--accent2) }
    .choice h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em }
    .choice p { font-size: 13px; color: var(--muted); line-height: 1.5 }
    .choice .go { margin-top: auto; font-size: 12px; font-weight: 600; color: var(--accent) }
    .choice.face .go { color: var(--accent2) }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<main>
  <nav class="topnav" data-trail="creer"></nav>
  <div class="card">
    <div class="logo"><span class="logo-dot"></span>Spline AR</div>
    <div>
      <h1 data-i18n-html="create.title"></h1>
      <p class="lead" data-i18n="create.lead"></p>
    </div>
    <div class="choices">
      <a class="choice" href="/creer/musee">
        <span class="choice-icon">▦</span>
        <h2 data-i18n="create.museumTitle"></h2>
        <p data-i18n="create.museumText"></p>
        <span class="go" data-i18n="create.museumGo"></span>
      </a>
      <a class="choice face" href="/creer/filtre">
        <span class="choice-icon">☺</span>
        <h2 data-i18n="create.filterTitle"></h2>
        <p data-i18n="create.filterText"></p>
        <span class="go" data-i18n="create.filterGo"></span>
      </a>
    </div>
  </div>
  <div class="card" id="creations">
    <div class="section-label" style="margin:0" data-i18n="works.title"></div>
    <div id="works" class="works"></div>
    <p class="help" style="margin-top:0" data-i18n="works.note"></p>
  </div>
</main>
<script type="module" src="/src/create.js"></script>
</body>
</html>
