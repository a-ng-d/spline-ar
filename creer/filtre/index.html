<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="filter.editor.pageTitle">Spline AR — Create a face filter</title>
  <link rel="stylesheet" href="/src/theme.css" />
  <style>
    body { min-height: 100vh; padding: 32px 16px 80px }
    main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
    main .card { max-width: none }
    select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; color: var(--text); font: 13px var(--font); outline: none }
    select:focus { border-color: var(--accent2) }
    option { background: #14141e }
    .row { display: grid; grid-template-columns: 112px 1fr 48px; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px }
    .row output { text-align: right; font: 12px var(--mono); color: var(--muted) }
    .expr { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; margin-top: 8px }
    .expr code { color: var(--accent2) }
    .expr span { color: var(--muted) }
    #result { display: none; flex-direction: column; gap: 14px }
    #result.visible { display: flex }
    .actions { display: flex; flex-wrap: wrap; gap: 8px }
    #qr-wrap { display: flex; justify-content: center }
    #qr { background: #fff; border-radius: 12px; padding: 10px; width: 220px; height: 220px }
    main h1 span { color: var(--accent2) }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<main>
  <nav class="topnav" data-trail="creer,filtre"></nav>
  <div class="card">
    <div class="logo"><span class="logo-dot"></span>Spline AR</div>
    <div>
      <h1 data-i18n-html="filter.editor.title"></h1>
      <p class="lead" data-i18n="filter.editor.lead"></p>
    </div>
    <div>
      <div class="section-label" data-i18n="filter.editor.titleLabel"></div>
      <input id="title" type="text" class="plain" maxlength="80" data-i18n-placeholder="filter.editor.titlePlaceholder" />
    </div>
    <div>
      <div class="section-label" data-i18n="editor.backLabel"></div>
      <input id="back" type="url" placeholder="https://cloud.protopie.io/p/…" />
      <p class="help" data-i18n="editor.backHelp"></p>
      <div id="back-msg" class="msg"></div>
    </div>
  </div>

  <div class="card">
    <div>
      <div class="section-label" data-i18n="editor.scene"></div>
      <input id="scene" type="url" data-i18n-placeholder="editor.scenePlaceholder" />
      <p class="help"><span data-i18n-html="editor.sceneHelp"></span> <span data-i18n="filter.editor.sceneTip"></span></p>
      <div id="scene-msg" class="msg"></div>
    </div>
    <div>
      <div class="section-label" data-i18n="filter.editor.point"></div>
      <select id="p"></select>
    </div>
    <div>
      <div class="section-label" data-i18n="settings.title"></div>
      <div class="row"><label data-i18n="settings.size"></label><input data-k="s" type="range" min="0.1" max="3" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.leftRight"></label><input data-k="x" type="range" min="-1" max="1" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.downUp"></label><input data-k="y" type="range" min="-1" max="1.5" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.frontBack"></label><input data-k="z" type="range" min="-1" max="1" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.rotation"></label><input data-k="ry" type="range" min="-180" max="180" step="5" /><output></output></div>
      <p class="help" data-i18n="filter.editor.settingsHelp"></p>
    </div>
  </div>

  <div class="card">
    <div class="section-label" data-i18n="filter.editor.reactTitle"></div>
    <p class="help" style="margin-top:0" data-i18n-html="filter.editor.reactHelp"></p>
    <div class="expr" id="expr"></div>
  </div>

  <div class="card">
    <button id="create" class="btn btn-primary btn-block" disabled></button>
    <div id="create-msg" class="msg"></div>
    <div id="saved-state" class="saved-state"></div>
    <div id="result">
      <div>
        <div class="section-label" data-i18n="editor.yourLink"></div>
        <input id="link" type="text" readonly />
      </div>
      <div class="actions">
        <button id="copy" class="btn btn-sm btn-ghost" data-i18n="actions.copy"></button>
        <a id="open" class="btn btn-sm btn-ghost" target="_blank" rel="noopener" data-i18n="actions.open"></a>
        <a id="qr-dl" class="btn btn-sm btn-ghost" download="spline-ar-filter-qr.png" data-i18n="editor.downloadQr"></a>
      </div>
      <div id="qr-wrap"><canvas id="qr" width="220" height="220"></canvas></div>
      <p class="help" style="text-align:center" data-i18n="filter.editor.testHelp"></p>
    </div>
  </div>
</main>
<script type="module" src="/src/filter-editor.js"></script>
</body>
</html>
