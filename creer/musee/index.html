<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="museum.editor.pageTitle">Spline AR — Create a museum</title>
  <link rel="stylesheet" href="/src/theme.css" />
  <style>
    body { min-height: 100vh; padding: 32px 16px 80px }
    main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
    main .card { max-width: none }

    .art-head { display: flex; align-items: center; justify-content: space-between; gap: 10px }
    .art-num { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px }
    .art-num b { width: 24px; height: 24px; border-radius: 50%; background: rgba(123,110,246,.15);
      border: 1px solid rgba(123,110,246,.4); color: var(--accent); display: inline-flex; align-items: center;
      justify-content: center; font-size: 12px }

    .drop { position: relative; display: flex; align-items: center; gap: 14px; border: 1px dashed var(--border);
      border-radius: 10px; padding: 12px; cursor: pointer; transition: border-color .15s, background .15s }
    .drop:hover { border-color: var(--accent); background: rgba(123,110,246,.06) }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
    .drop img { width: 72px; height: 96px; object-fit: contain; border-radius: 6px; background: rgba(255,255,255,.04); flex: none }
    .drop img[hidden] + .drop-text { padding: 26px 0 }
    .drop-text { font-size: 13px; line-height: 1.45 }
    .drop-text small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px }

    details { border-top: 1px solid var(--border); padding-top: 12px }
    summary { cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px }
    summary::-webkit-details-marker { display: none }
    summary::before { content: '▶'; color: var(--accent); font-size: 9px; transition: transform .15s }
    details[open] summary::before { transform: rotate(90deg) }
    .row { display: grid; grid-template-columns: 112px 1fr 48px; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px }
    .row select { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 10px;
      padding: 7px 10px; color: var(--text); font: 13px var(--font) }
    .row select option { background: #14141e }
    .row output { text-align: right; font: 12px var(--mono); color: var(--muted) }

    #result { display: none; flex-direction: column; gap: 14px }
    #result.visible { display: flex }
    .actions { display: flex; flex-wrap: wrap; gap: 8px }
    #qr-wrap { display: flex; justify-content: center }
    #qr { background: #fff; border-radius: 12px; padding: 10px; width: 220px; height: 220px }
    .counter { font-size: 12px; color: var(--muted); text-align: center }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<main>
  <nav class="topnav" data-trail="creer,musee"></nav>
  <div class="card">
    <div class="logo"><span class="logo-dot"></span>Spline AR</div>
    <div>
      <h1 data-i18n-html="museum.editor.title"></h1>
      <p class="lead" data-i18n="museum.editor.lead"></p>
    </div>
    <div>
      <div class="section-label" data-i18n="museum.editor.titleLabel"></div>
      <input id="title" type="text" class="plain" maxlength="80" data-i18n-placeholder="museum.editor.titlePlaceholder" />
    </div>
    <div>
      <div class="section-label" data-i18n="editor.backLabel"></div>
      <input id="back" type="url" placeholder="https://cloud.protopie.io/p/…" />
      <p class="help" data-i18n="editor.backHelp"></p>
      <div id="back-msg" class="msg"></div>
    </div>
    <div class="divider" data-i18n="museum.editor.importDivider"></div>
    <div style="display:flex;gap:8px">
      <input id="import" type="url" data-i18n-placeholder="museum.editor.importPlaceholder" />
      <button id="import-btn" class="btn btn-sm btn-ghost" data-i18n="actions.load"></button>
    </div>
    <div id="import-msg" class="msg"></div>
  </div>

  <div id="list" style="display:flex;flex-direction:column;gap:16px"></div>

  <button id="add" class="btn btn-ghost btn-block" data-i18n="museum.editor.addPoster"></button>
  <div id="counter" class="counter"></div>

  <div class="card">
    <button id="create" class="btn btn-primary btn-block" disabled></button>
    <div id="create-msg" class="msg"></div>
    <div id="saved-state" class="saved-state"></div>
    <div id="result">
      <div>
        <div class="section-label" data-i18n="editor.yourLink"></div>
        <input id="link" type="text" readonly />
      </div>
      <div class="actions">
        <button id="copy" class="btn btn-sm btn-ghost" data-i18n="actions.copy"></button>
        <a id="open" class="btn btn-sm btn-ghost" target="_blank" rel="noopener" data-i18n="actions.open"></a>
        <a id="gallery" class="btn btn-sm btn-ghost" target="_blank" rel="noopener" data-i18n="museum.editor.showPosters"></a>
        <a id="qr-dl" class="btn btn-sm btn-ghost" download="spline-ar-museum-qr.png" data-i18n="editor.downloadQr"></a>
      </div>
      <div id="qr-wrap"><canvas id="qr" width="220" height="220"></canvas></div>
      <p class="help" style="text-align:center" data-i18n="museum.editor.testHelp"></p>
    </div>
  </div>
</main>

<template id="art-tpl">
  <section class="card art">
    <div class="art-head">
      <div class="art-num"><b></b><span data-i18n="museum.editor.poster"></span></div>
      <button class="btn btn-sm btn-danger remove" data-i18n-title="museum.editor.removePoster">✕</button>
    </div>
    <label class="drop">
      <input class="file" type="file" accept="image/jpeg,image/png,image/webp" />
      <img class="thumb" alt="" hidden />
      <span class="drop-text"><span data-i18n="museum.editor.chooseImage"></span><small data-i18n="museum.editor.imageHelp"></small></span>
    </label>
    <div class="msg file-msg"></div>
    <div>
      <div class="section-label" data-i18n="editor.scene"></div>
      <input class="scene" type="url" data-i18n-placeholder="editor.scenePlaceholder" />
      <p class="help" data-i18n-html="editor.sceneHelp"></p>
      <div class="msg scene-msg"></div>
    </div>
    <details>
      <summary data-i18n="settings.title"></summary>
      <div class="row"><label data-i18n="settings.poster"></label><select data-k="pl" class="pl"><option value="0" data-i18n="settings.posterWall"></option><option value="1" data-i18n="settings.posterFlat"></option></select><output hidden></output></div>
      <div class="row"><label data-i18n="settings.size"></label><input data-k="s" type="range" min="0.1" max="2" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.leftRight"></label><input data-k="x" type="range" min="-1" max="1" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.downUp"></label><input data-k="y" type="range" min="-1" max="1" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.lift"></label><input data-k="z" type="range" min="0" max="1" step="0.05" /><output></output></div>
      <div class="row"><label data-i18n="settings.rotation"></label><input data-k="ry" type="range" min="-180" max="180" step="5" /><output></output></div>
      <p class="help" data-i18n="museum.editor.settingsHelp"></p>
    </details>
  </section>
</template>

<script type="module" src="/src/museum-editor.js"></script>
</body>
</html>
