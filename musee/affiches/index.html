<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="posters.pageTitle">Spline AR — Posters</title>
  <link rel="stylesheet" href="/src/theme.css" />
  <style>
    body { min-height: 100vh; padding: 32px 16px }
    main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px }
    header { display: flex; flex-direction: column; gap: 8px }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px;
      cursor: zoom-in; transition: border-color .15s, background .15s }
    .tile:hover { border-color: var(--accent); background: rgba(123,110,246,.08) }
    .tile img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; display: block; border-radius: 8px }
    .tile span { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center }
    /* Full screen: one poster to aim at with the phone */
    #full { position: fixed; inset: 0; z-index: 50; background: #111; display: none; align-items: center;
      justify-content: center; cursor: zoom-out }
    #full.visible { display: flex }
    #full img { max-width: 100vw; max-height: 100vh; display: block }
    #full .pill { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .8 }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <main>
    <nav class="topnav" data-trail="creer,musee,affiches"></nav>
    <header>
      <div class="logo"><span class="logo-dot"></span>Spline AR</div>
      <h1 id="title" data-i18n-html="posters.title"></h1>
      <p class="lead" data-i18n="posters.lead"></p>
    </header>
    <div id="grid" class="grid"></div>
  </main>
  <div id="full"><img alt="" data-i18n-aria-label="posters.poster" /><div class="pill" data-i18n="posters.fullHint"></div></div>

  <!-- ?a=<id>&a=<id>… (gallery) or ?target=<id> (one poster, straight to full screen); no parameter: demo poster -->
  <script type="module" src="/src/posters.js"></script>
</body>
</html>
