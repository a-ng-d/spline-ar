[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# The Spline CDN sends no CORS headers: same-origin proxy.
[[redirects]]
  from = "/spline-proxy/*"
  to = "https://prod.spline.design/:splat"
  status = 200
  force = true

# Targets and assets readable from other sites (targets hosted elsewhere).
[[headers]]
  for = "/image-targets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
